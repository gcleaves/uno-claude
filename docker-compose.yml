services:
  uno:
    build: .
    image: uno-claude
    restart: unless-stopped
    ports:
      # Publish somewhere else with UNO_PORT=8080 docker compose up -d.
      - "${UNO_PORT:-3001}:3001"
    environment:
      # --- authentication -------------------------------------------------
      # 'guest' lets anyone with a room code play. Switch to 'keycloak' and
      # fill in the two variables below to require a signed-in account.
      AUTH_MODE: ${AUTH_MODE:-guest}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}

      # --- networking -----------------------------------------------------
      # The client is served from the same origin as the socket, so the default
      # needs no CORS. Set this if you serve the UI from somewhere else.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

      # --- game timing ----------------------------------------------------
      RECONNECT_GRACE_SEC: ${RECONNECT_GRACE_SEC:-120}
      # Turn clocks: when one expires the server draws and forfeits the turn,
      # so one player stepping away cannot stall everyone else. 0 disables.
      FORCED_ACTION_SEC: ${FORCED_ACTION_SEC:-5}
      TURN_TIMEOUT_SEC: ${TURN_TIMEOUT_SEC:-45}
      AFK_TURN_SEC: ${AFK_TURN_SEC:-20}

      # --- surviving restarts ---------------------------------------------
      # Games are snapshotted to the volume below and restored on boot, so a
      # redeploy does not end them. Set SNAPSHOT_PATH empty to turn this off.
      SNAPSHOT_PATH: ${SNAPSHOT_PATH-/data/rooms.json}
      SNAPSHOT_INTERVAL_SEC: ${SNAPSHOT_INTERVAL_SEC:-10}
      RESUME_GRACE_SEC: ${RESUME_GRACE_SEC:-30}
      EMPTY_ROOM_TTL_MIN: ${EMPTY_ROOM_TTL_MIN:-15}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      # Holds the game snapshot. Without it, games survive a process restart but
      # not the container being recreated.
      - uno-data:/data
    read_only: true
    tmpfs:
      # tsx compiles TypeScript to a cache under /tmp, which a read-only root
      # filesystem would otherwise deny.
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Give the process a moment to write its final snapshot before SIGKILL.
    stop_grace_period: 15s

volumes:
  uno-data:
